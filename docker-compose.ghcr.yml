# Example GHCR compose file. The deployed stack is Git-managed in the
# homelab repo: ~/Repos/homelab/docker-services/excalidraw/compose.yml
# (latest image for normal deploys, host data path per homelab conventions).
services:
  excalidraw:
    image: ghcr.io/victortolosa/excalidraw:latest
    container_name: excalidraw
    ports:
      - "8085:80"
    volumes:
      # Drawings, .dashboard.json, .thumbnails/ — plain files, back up separately
      - ./data:/data
    restart: unless-stopped
    environment:
      - TZ=UTC
