name: build-and-push

# On every push to `custom`, GitHub-hosted runners build the Excalidraw Docker
# image and push it to GitHub Container Registry (ghcr.io). The deployment
# server pulls this image via `docker compose pull` — it never builds locally.

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Match the deployment server's CPU architecture.
          # Change to linux/arm64 if the server is ARM.
          platforms: linux/amd64
          tags: |
            ghcr.io/victortolosa/excalidraw:latest
            ghcr.io/victortolosa/excalidraw:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
